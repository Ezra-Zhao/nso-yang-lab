name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyang and pytest
        run: pip install pyang pytest
      - name: Validate YANG model with pyang
        run: pyang models/site-service.yang
      - name: Run tests
        run: python -m pytest tests/ -v
